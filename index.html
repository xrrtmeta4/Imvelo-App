  <body>
    <!-- Animated white splash — hidden by React when the app mounts -->
    <style>
      #imvelo-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
      #imvelo-splash.hide{display:none}
      #imvelo-splash .logo{width:104px;height:104px;border-radius:28px;background:linear-gradient(135deg,#22c55e,#15803d);display:grid;place-items:center;box-shadow:0 20px 40px -12px rgba(34,197,94,.35)}
      #imvelo-splash .logo svg{width:56px;height:56px;color:#fff}
      #imvelo-splash .name{font-size:26px;font-weight:800;letter-spacing:-.02em;color:#0f172a}
      #imvelo-splash .tag{font-size:13px;color:#64748b}
    </style>
    <div id="imvelo-splash" role="status" aria-label="Loading Imvelo">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 20c3.5 0 6.5-3 6.5-6.5S10.5 7 7 7" />
          <path d="M17 20c-3.5 0-6.5-3-6.5-6.5S13.5 7 17 7" />
          <path d="M12 20V4" />
        </svg>
      </div>
      <div class="name">Imvelo</div>
      <div class="tag">Farmer's best friend</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash on first React paint (or after 3s failsafe)
      (function(){
        var hide=function(){var el=document.getElementById('imvelo-splash');if(el&&el.parentNode){el.parentNode.removeChild(el);}};
        var root=document.getElementById('root');
        var obs=new MutationObserver(function(){if(root && root.children.length){hide();obs.disconnect();}});
        obs.observe(root,{childList:true});
        setTimeout(hide,3000);
      })();
    </script>
  </body>
