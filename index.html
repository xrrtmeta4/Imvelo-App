  <body>
    <!-- Animated white splash — hidden by React when the app mounts -->
    <style>
      #imvelo-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:opacity .5s ease,visibility .5s ease}
      #imvelo-splash.hide{opacity:0;visibility:hidden;pointer-events:none}
      #imvelo-splash .logo{width:104px;height:104px;border-radius:28px;background:linear-gradient(135deg,#22c55e,#15803d);display:grid;place-items:center;box-shadow:0 20px 40px -12px rgba(34,197,94,.35);animation:splashPop .8s cubic-bezier(.2,.9,.3,1.3) both}
      #imvelo-splash .logo svg{width:56px;height:56px;color:#fff;animation:splashSpin 1.6s ease-in-out infinite}
      #imvelo-splash .name{font-size:26px;font-weight:800;letter-spacing:-.02em;color:#0f172a;opacity:0;animation:splashFade .6s .25s ease forwards}
      #imvelo-splash .tag{font-size:13px;color:#64748b;opacity:0;animation:splashFade .6s .45s ease forwards}
      #imvelo-splash .bar{width:140px;height:4px;border-radius:999px;background:#e2e8f0;overflow:hidden}
      #imvelo-splash .bar::after{content:"";display:block;height:100%;width:40%;background:linear-gradient(90deg,#22c55e,#84cc16);border-radius:inherit;animation:splashBar 1.2s ease-in-out infinite}
      @keyframes splashPop{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
      @keyframes splashSpin{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
      @keyframes splashFade{to{opacity:1;transform:none}}
      @keyframes splashBar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
      @media (prefers-reduced-motion:reduce){#imvelo-splash *{animation:none!important;transition:none!important}}
    </style>
    <div id="imvelo-splash" role="status" aria-label="Loading Imvelo">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 20c3.5 0 6.5-3 6.5-6.5S10.5 7 7 7" />
          <path d="M17 20c-3.5 0-6.5-3-6.5-6.5S13.5 7 17 7" />
          <path d="M12 20V4" />
        </svg>
      </div>
      <div class="name">Imvelo</div>
      <div class="tag">Farmer's best friend</div>
      <div class="bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash on first React paint (or after 3s failsafe)
      (function(){
        var hide=function(){var el=document.getElementById('imvelo-splash');if(el){el.classList.add('hide');setTimeout(function(){el&&el.parentNode&&el.parentNode.removeChild(el);},600);}};
        var root=document.getElementById('root');
        var obs=new MutationObserver(function(){if(root && root.children.length){hide();obs.disconnect();}});
        obs.observe(root,{childList:true});
        setTimeout(hide,3000);
      })();
    </script>
  </body>
